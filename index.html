<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>雪峰Agent</title>
<style>
:root{
  --bg:#fafaf8;
  --side:#f0ede5;
  --card:#ffffff;
  --card2:#f7f4ed;
  --bdr:#d0ccc0;
  --txt:#1a1a1a;
  --t2:#6f6a60;
  --red:#d04040;
  --green:#22863a;
  --shadow:0 12px 32px rgba(0,0,0,.08);
}
.dark{
  --bg:#1a1a18;
  --side:#222220;
  --card:#2a2a26;
  --card2:#33322d;
  --bdr:#44443d;
  --txt:#e6e2d9;
  --t2:#aaa396;
  --red:#e05555;
  --green:#4cc06f;
  --shadow:0 14px 36px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font:14px/1.75 "PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--txt);
  height:100vh;
  display:flex;
}
.side{
  width:280px;
  background:var(--side);
  border-right:1px solid var(--bdr);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  overflow:hidden;
}
.side h2{padding:20px 18px 8px;font-size:18px}
.side .sub{
  font-size:11px;
  color:var(--t2);
  padding:0 18px 16px;
  border-bottom:1px solid var(--bdr);
}
.list{overflow-y:auto;padding:8px 12px;flex:1;min-height:60px}
.item{
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  color:var(--t2);
  margin-bottom:6px;
  border:1px solid transparent;
  background:transparent;
}
.item:hover{background:var(--card)}
.item.on{
  background:var(--card);
  color:var(--txt);
  border-color:var(--bdr);
  box-shadow:var(--shadow);
}
.item .tit{
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:space-between;
}
.item .name{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.item .meta{
  margin-top:6px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  opacity:.8;
}
.tag{
  display:inline-flex;
  align-items:center;
  padding:1px 6px;
  border-radius:999px;
  font-size:10px;
  border:1px solid var(--bdr);
  color:var(--t2);
}
.del{
  opacity:.45;
  font-size:12px;
  cursor:pointer;
  padding:0 4px;
}
.del:hover{opacity:1;color:var(--red)}
.new-btn{
  margin:8px 12px 16px;
  padding:10px;
  text-align:center;
  border:1px dashed var(--bdr);
  border-radius:10px;
  cursor:pointer;
  font-size:12px;
  color:var(--t2);
}
.new-btn:hover{background:var(--card)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{
  min-height:64px;
  display:flex;
  align-items:center;
  padding:10px 18px;
  border-bottom:1px solid var(--bdr);
  gap:10px;
  background:var(--side);
  flex-wrap:wrap;
}
.bar .logo{font-weight:700;font-size:17px;margin-right:auto}
.bar button{
  padding:8px 12px;
  border:1px solid var(--bdr);
  border-radius:10px;
  background:var(--card);
  cursor:pointer;
  font-size:12px;
  color:var(--txt);
}
.bar button.on{background:var(--red);color:#fff;border-color:var(--red)}
.bar .api-btn{background:var(--red);color:#fff;border-color:var(--red)}
.bar img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--bdr);
}
.plan-on{border-color:var(--green)!important;color:var(--green)!important}
.msgs{
  flex:1;
  overflow-y:auto;
  padding:22px 24px 20px;
  background:
    radial-gradient(circle at top right, rgba(208,64,64,.06), transparent 32%),
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%);
}
.tip-wrap{
  padding:10px 18px 0;
  background:var(--bg);
}
.tip-panel{
  border:1px solid var(--bdr);
  background:var(--card);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.tip-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 14px;
  cursor:pointer;
}
.tip-title{
  font-size:13px;
  font-weight:700;
}
.tip-sub{
  font-size:12px;
  color:var(--t2);
}
.tip-toggle{
  border:none;
  background:transparent;
  color:var(--t2);
  cursor:pointer;
  font-size:12px;
}
.tip-body{
  padding:0 14px 14px;
  border-top:1px solid var(--bdr);
}
.tip-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
  margin-top:12px;
}
.tip-card{
  background:var(--card2);
  border:1px solid var(--bdr);
  border-radius:12px;
  padding:10px 12px;
}
.tip-card b{
  display:block;
  margin-bottom:6px;
  font-size:12px;
}
.tip-card p{
  font-size:12px;
  color:var(--txt);
  line-height:1.7;
}
.tip-wrap.collapsed .tip-body{display:none}
.welcome{
  text-align:center;
  margin:80px auto 0;
  color:var(--t2);
  max-width:520px;
}
.welcome .icon{font-size:46px;margin-bottom:12px}
.welcome p{margin-top:10px}
.msg-row{display:flex;margin-bottom:14px}
.msg-row.user{justify-content:flex-end}
.bubble{
  max-width:min(780px,78%);
  padding:14px 16px;
  border-radius:16px;
  line-height:1.8;
  font-size:14px;
  word-break:break-word;
  white-space:pre-wrap;
  box-shadow:var(--shadow);
}
.bubble.user{
  background:var(--red);
  color:#fff;
  box-shadow:none;
}
.bubble.assistant{
  background:var(--card);
  border:1px solid var(--bdr);
}
.who{
  font-size:11px;
  opacity:.7;
  margin-bottom:6px;
}
.status{
  font-size:12px;
  color:var(--t2);
  margin-bottom:8px;
}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dot{
  width:6px;height:6px;border-radius:50%;background:var(--t2);
  animation:dot 1.2s infinite ease-in-out;
}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes dot{
  0%,80%,100%{transform:scale(.6);opacity:.5}
  40%{transform:scale(1);opacity:1}
}
.msg-text{color:inherit}
.msg-empty{color:var(--t2)}
details.evidence{
  margin-top:12px;
  padding:10px 12px;
  border-radius:12px;
  background:var(--card2);
  border:1px solid var(--bdr);
}
details.evidence summary{
  cursor:pointer;
  font-size:12px;
  color:var(--t2);
  user-select:none;
}
.volunteer-table{
  margin-top:12px;
  border:1px solid var(--bdr);
  border-radius:12px;
  overflow:hidden;
  background:var(--card);
  box-shadow:var(--shadow);
}
.volunteer-table-head{
  padding:12px 14px;
  font-size:13px;
  font-weight:700;
  background:var(--card2);
  border-bottom:1px solid var(--bdr);
}
.volunteer-table-wrap{
  overflow-x:auto;
}
.volunteer-table table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
.volunteer-table tbody tr:nth-child(even){
  background:rgba(0,0,0,.018);
}
.volunteer-table th,
.volunteer-table td{
  padding:10px 12px;
  border-bottom:1px solid var(--bdr);
  text-align:left;
  vertical-align:top;
  white-space:nowrap;
}
.volunteer-table th{
  background:rgba(208,64,64,.08);
  color:var(--txt);
  font-weight:700;
}
.volunteer-table tr:last-child td{
  border-bottom:none;
}
.volunteer-level{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:34px;
  padding:3px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  border:1px solid transparent;
}
.volunteer-level.chong{
  background:rgba(208,64,64,.12);
  color:#b62828;
  border-color:rgba(208,64,64,.22);
}
.volunteer-level.wen{
  background:rgba(210,145,44,.12);
  color:#9a6400;
  border-color:rgba(210,145,44,.22);
}
.volunteer-level.bao{
  background:rgba(34,134,58,.12);
  color:#1e7b35;
  border-color:rgba(34,134,58,.22);
}
.volunteer-school{
  font-weight:700;
  color:var(--txt);
}
.volunteer-major{
  margin-top:4px;
  white-space:normal;
  color:var(--t2);
  line-height:1.6;
}
.volunteer-meta{
  color:var(--t2);
}
@media (max-width:720px){
  .volunteer-table{
    margin-top:10px;
  }
  .volunteer-table-head{
    padding:10px 12px;
  }
  .volunteer-table th,
  .volunteer-table td{
    padding:9px 10px;
    white-space:normal;
  }
  .volunteer-table th:nth-child(4),
  .volunteer-table td:nth-child(4),
  .volunteer-table th:nth-child(7),
  .volunteer-table td:nth-child(7){
    display:none;
  }
}
@media (max-width:560px){
  .volunteer-table th:nth-child(5),
  .volunteer-table td:nth-child(5),
  .volunteer-table th:nth-child(6),
  .volunteer-table td:nth-child(6){
    display:none;
  }
}
.evidence-block{margin-top:10px}
.evidence-title{font-size:12px;font-weight:700;margin-bottom:4px}
.evidence-text{font-size:12px;color:var(--txt);white-space:pre-wrap}
.evidence-line{font-size:12px;color:var(--txt);margin-top:3px}
.inp{
  padding:14px 18px 18px;
  display:flex;
  gap:10px;
  align-items:flex-end;
  border-top:1px solid var(--bdr);
  background:var(--side);
}
.inp textarea{
  flex:1;
  padding:12px 14px;
  border:1px solid var(--bdr);
  border-radius:14px;
  font:inherit;
  resize:none;
  min-height:56px;
  max-height:180px;
  background:var(--card);
  color:var(--txt);
  outline:none;
}
.inp textarea:focus{border-color:var(--red)}
.inp button{
  padding:0 22px;
  height:56px;
  background:var(--red);
  color:#fff;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-weight:600;
}
.inp button:disabled{opacity:.6;cursor:not-allowed}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:99;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.overlay-card{
  background:var(--card);
  border-radius:18px;
  padding:28px;
  width:min(520px,100%);
  border:1px solid var(--bdr);
  box-shadow:var(--shadow);
}
.overlay h3{margin-bottom:16px}
.overlay label{display:block;font-size:11px;color:var(--t2);margin:12px 0 4px}
.overlay input,
.overlay select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--bdr);
  border-radius:10px;
  font:inherit;
  background:var(--bg);
  color:var(--txt);
}
.hint-box{
  background:var(--card2);
  border-radius:12px;
  padding:10px 12px;
  margin:8px 0 10px;
  font-size:12px;
  line-height:1.7;
  color:var(--txt);
  border:1px solid var(--bdr);
}
.hint-box a{color:var(--red)}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{
  padding:10px 16px;
  border:1px solid var(--bdr);
  border-radius:10px;
  cursor:pointer;
  background:var(--card);
  color:var(--txt);
}
.btns .ok{flex:1;background:var(--red);color:#fff;border-color:var(--red)}
.st{font-size:12px;margin-top:10px}
.st.g{color:var(--green)}
.st.b{color:var(--red)}
.fun-bg{position:relative}
.fun-bg::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:52%;
  background:url(/img_scifi.png) left center/contain no-repeat;
  opacity:.08;
  pointer-events:none;
}
.fun-bg>*{position:relative}
@media (max-width:900px){
  body{flex-direction:column}
  .side{width:100%;height:auto;max-height:42vh;border-right:none;border-bottom:1px solid var(--bdr)}
  .bubble{max-width:100%}
}
</style>
</head>
<body>
<div class="side">
  <h2>雪峰Agent v3</h2>
  <div class="sub">AI高考志愿顾问</div>
  <div class="new-btn" id="newBtn">+ 新建对话</div>
  <div class="list" id="chatList"></div>
</div>

<div class="main">
  <div class="bar">
    <span class="logo">雪峰Agent</span>
    <button id="btnG" class="on">报考</button>
    <button id="btnF">娱乐</button>
    <button id="planBtn">计划模式</button>
    <img id="avt" src="/img_suit.png" alt="头像">
    <button id="themeBtn">🌓</button>
    <button class="api-btn" id="apiBtn">API设置</button>
  </div>
  <div class="tip-wrap" id="tipWrap">
    <div class="tip-panel">
      <div class="tip-head" id="tipHead">
        <div>
          <div class="tip-title">提问提示</div>
          <div class="tip-sub" id="tipSub">把关键信息说清楚，我会更快给到能用的建议。</div>
        </div>
        <button class="tip-toggle" id="tipToggle">收起</button>
      </div>
      <div class="tip-body" id="tipBody">
        <div class="tip-grid" id="tipGrid"></div>
      </div>
    </div>
  </div>
  <div class="msgs" id="msgArea"></div>
  <div class="inp">
    <textarea id="inp" placeholder="输入消息..."></textarea>
    <button id="sendBtn">发送</button>
  </div>
</div>

<div class="overlay" id="setOverlay">
  <div class="overlay-card" id="setCard">
    <h3>API设置</h3>
    <label>供应商</label>
    <select id="sVendor"></select>
    <label>Base URL</label>
    <input id="sUrl" placeholder="https://api.deepseek.com">
    <label>API Key</label>
    <input type="password" id="sKey" placeholder="sk-...">
    <label>Model</label>
    <select id="sModel"></select>
    <input id="sModelCustom" placeholder="自定义模型名" style="display:none;margin-top:8px">
    <label>Tavily Key <span style="color:var(--red);font-size:11px;font-weight:600">(选填，但强烈推荐)</span></label>
    <input type="password" id="sTav" placeholder="tvly-...">
    <div class="hint-box">
      <div><b>推荐模型：</b>普通对话默认用 deepseek-v4-flash，需要更强推理时再切 deepseek-v4-pro。</div>
      <div><b>Tavily 是干什么的：</b>给 AI 做联网搜索补充，学校环境、王牌专业、行业趋势会更准。</div>
      <div><b>怎么拿：</b>打开 <a href="https://tavily.com" target="_blank" rel="noreferrer">tavily.com</a> 注册后，把 tvly- 开头的 Key 粘过来。</div>
    </div>
    <div class="btns">
      <button id="closeSetBtn">取消</button>
      <button class="ok" id="testBtn">保存并测试</button>
    </div>
    <div class="st" id="st"></div>
  </div>
</div>

<script>
var MODELS = {
  '': 'deepseek-v4-flash',
  'deepseek-chat': 'deepseek-v4-flash',
  'deepseek-reason': 'deepseek-v4-pro',
  'deepseek-reasoner': 'deepseek-v4-pro'
};

var API_VENDORS = {
  deepseek: {
    label: 'DeepSeek',
    urls: [
      'https://api.deepseek.com'
    ],
    models: [
      {value:'deepseek-v4-flash', label:'deepseek-v4-flash'},
      {value:'deepseek-v4-pro', label:'deepseek-v4-pro'}
    ]
  },
  custom: {
    label: '自定义',
    urls: [],
    models: []
  }
};

var FIELD_LABELS = {
  province: '所在省份',
  score_or_rank: '分数或位次',
  subject: '选科方向',
  majors: '意向专业',
  accept_adjustment: '是否接受调剂',
  region_pref: '地域偏好',
  career_goal: '发展方向',
  budget: '学费预算',
  topic: '想聊的话题',
  goal: '你想得到的结果',
  style: '回答风格',
  guardrails: '不想碰的话题'
};

var TIP_CONTENT = {
  gaokao: {
    sub: '说得越具体，建议越准；如果不确定，也可以直接说“不知道”。',
    items: [
      {title:'最快上手', text:'江苏历史类，533分，想留省内，能接受调剂。'},
      {title:'说清偏好', text:'山东物化地，12万位次，想学计算机，不想去太远，毕业想直接就业。'},
      {title:'不知道专业也行', text:'我不知道学什么，普通家庭，想稳定一点，最好以后方便考公。'}
    ]
  },
  fun: {
    sub: '想轻松聊也可以，直接说你想听点评、吐槽还是拿主意。',
    items: [
      {title:'随便开场', text:'帮我用大白话分析一下，文科女生学什么更稳。'},
      {title:'想听直一点', text:'别太客气，直接说我这个分数该怎么选。'},
      {title:'想轻松一点', text:'用张雪峰那种风格，给我讲讲法学到底值不值得学。'}
    ]
  }
};

var chats = loadChats();
var curId = localStorage.getItem('xf_cur') || '';
var mode = localStorage.getItem('xf_mode') || 'gaokao';
var isSending = false;
var APP_VERSION = '2026-06-24-qa3';

function S(id){return document.getElementById(id);}

function optionHtml(value, label){
  return '<option value="'+escapeHtml(value)+'">'+escapeHtml(label || value)+'</option>';
}

function normalizeModelName(name){
  var model = (name || '').trim();
  return MODELS.hasOwnProperty(model) ? MODELS[model] : (model || 'deepseek-v4-flash');
}

function normalizeVendorName(name){
  var vendor = String(name || '').trim();
  return API_VENDORS[vendor] ? vendor : 'deepseek';
}

function inferVendorFromConfig(cfg){
  var model = normalizeModelName(cfg.model || '');
  var url = String(cfg.url || '').trim();
  if(model.indexOf('deepseek-') === 0 || /deepseek\.com/i.test(url)) return 'deepseek';
  return 'custom';
}

function renderVendorOptions(selectedVendor){
  var vendor = normalizeVendorName(selectedVendor);
  S('sVendor').innerHTML = Object.keys(API_VENDORS).map(function(key){
    return optionHtml(key, API_VENDORS[key].label);
  }).join('');
  S('sVendor').value = vendor;
}

function renderUrlOptions(vendor, selectedUrl){
  var info = API_VENDORS[normalizeVendorName(vendor)];
  var urls = info.urls || [];
  var fallbackUrl = urls[0] || '';
  S('sUrl').value = selectedUrl || fallbackUrl;
  S('sUrl').placeholder = fallbackUrl || 'https://api.example.com';
}

function renderModelOptions(vendor, selectedModel){
  var info = API_VENDORS[normalizeVendorName(vendor)];
  var models = info.models || [];
  var modelSelect = S('sModel');
  var modelCustom = S('sModelCustom');
  if(models.length){
    modelSelect.style.display = '';
    modelCustom.style.display = 'none';
    modelSelect.innerHTML = models.map(function(item){
      return optionHtml(item.value, item.label);
    }).join('');
    var normalizedModel = normalizeModelName(selectedModel || '');
    var exists = models.some(function(item){ return item.value === normalizedModel; });
    modelSelect.value = exists ? normalizedModel : (models[0] ? models[0].value : 'deepseek-v4-flash');
    modelCustom.value = '';
  }else{
    modelSelect.style.display = 'none';
    modelCustom.style.display = '';
    modelSelect.innerHTML = '';
    modelCustom.value = selectedModel || '';
  }
}

function syncApiFields(vendor, cfg){
  var safeVendor = normalizeVendorName(vendor || inferVendorFromConfig(cfg || {}));
  renderVendorOptions(safeVendor);
  renderUrlOptions(safeVendor, (cfg && cfg.url) || '');
  renderModelOptions(safeVendor, (cfg && cfg.model) || '');
}

function defaultPlanEnabled(chatMode){
  return chatMode === 'gaokao';
}

function initPlanState(chatMode){
  if(chatMode === 'gaokao'){
    return {
      mode:'gaokao',
      collected:{province:'',rank:0,score:0,subject:'',majors:[],major_unknown:false,schools:[],accept_adjustment:null,region_pref:[],region_avoid:[],career_goal:'',budget:''},
      asked_fields:[],
      asked_count:{},
      current_questions:[],
      ready:false
    };
  }
  return {
    mode:'fun',
    collected:{topic:'',goal:'',style:'',guardrails:[]},
    asked_fields:[],
    asked_count:{},
    current_questions:[],
    ready:false
  };
}

function stripMarkdownNoise(text){
  var t = String(text || '');
  if(!t) return '';
  t = t.replace(/```[\s\S]*?```/g, function(block){
    return block.replace(/```/g,'').trim();
  });
  t = t.replace(/^\s*#{1,6}\s*/gm, '');
  t = t.replace(/\*\*(.*?)\*\*/g, '$1');
  t = t.replace(/\*(.*?)\*/g, '$1');
  t = t.replace(/`([^`]+)`/g, '$1');
  t = t.replace(/^\s*>\s?/gm, '');
  t = t.replace(/^\s*[-*]\s+/gm, '• ');
  t = t.replace(/^\s*\|/gm, '');
  t = t.replace(/\|/g, ' ');
  t = t.replace(/^\s*---+\s*$/gm, '');
  t = t.replace(/\n{3,}/g, '\n\n');
  return t.trim();
}

function looksLikeQuestionText(text){
  var t = String(text || '').trim();
  return /^先补[一两1-2]?条?最关键的信息/.test(t)
    || /^先补一条最关键的信息/.test(t)
    || /^我先问你一两句/.test(t);
}

function escapeHtml(text){
  return String(text || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function normalizeMessage(msg, chatMode){
  msg = msg || {};
  var role = msg.role === 'assistant' ? 'assistant' : 'user';
  var rawText = String(msg.rawText || msg.displayText || msg.content || '');
  var displayText = role === 'assistant' ? stripMarkdownNoise(rawText) : rawText;
  var kind = msg.kind || (role === 'assistant' ? 'answer' : 'text');
  if(role === 'assistant' && looksLikeQuestionText(displayText)){
    kind = 'question';
  }
  return {
    role: role,
    displayText: displayText,
    rawText: role === 'assistant' ? rawText : '',
    evidence: kind === 'question' ? null : (msg.evidence || null),
    planState: msg.planState || null,
    status: msg.status || '',
    kind: kind
  };
}

function normalizeAllChatsForVersion(){
  var oldVersion = localStorage.getItem('xf_app_version') || '';
  if(oldVersion === APP_VERSION) return;
  Object.keys(chats).forEach(function(id){
    var chat = chats[id];
    if(!chat || !Array.isArray(chat.msgs)) return;
    chat.msgs = chat.msgs.map(function(msg){
      var normalized = normalizeMessage(msg, chat.mode || 'gaokao');
      if(normalized.kind === 'question'){
        normalized.evidence = null;
      }
      return normalized;
    });
  });
  localStorage.setItem('xf_app_version', APP_VERSION);
}

function normalizeChat(chat, fallbackMode){
  chat = chat || {};
  var chatMode = chat.mode || fallbackMode || 'gaokao';
  var msgs = Array.isArray(chat.msgs) ? chat.msgs.map(function(msg){ return normalizeMessage(msg, chatMode); }) : [];
  return {
    name: chat.name || '新对话',
    mode: chatMode,
    msgs: msgs,
    planEnabled: typeof chat.planEnabled === 'boolean' ? chat.planEnabled : defaultPlanEnabled(chatMode),
    planState: chat.planState || initPlanState(chatMode)
  };
}

function loadChats(){
  var raw = {};
  try{
    raw = JSON.parse(localStorage.getItem('xf_chats') || '{}') || {};
  }catch(e){
    raw = {};
  }
  var result = {};
  Object.keys(raw).forEach(function(id){
    result[id] = normalizeChat(raw[id], 'gaokao');
  });
  return result;
}

function serializeChats(){
  var out = {};
  Object.keys(chats).forEach(function(id){
    var chat = chats[id];
    out[id] = {
      name: chat.name,
      mode: chat.mode,
      planEnabled: !!chat.planEnabled,
      planState: chat.planState || initPlanState(chat.mode),
      msgs: (chat.msgs || []).map(function(msg){
        return {
          role: msg.role,
          displayText: msg.displayText || '',
          evidence: msg.evidence || null,
          planState: msg.planState || null,
          status: '',
          kind: msg.kind || (msg.role === 'assistant' ? 'answer' : 'text')
        };
      })
    };
  });
  return out;
}

function save(){
  localStorage.setItem('xf_chats', JSON.stringify(serializeChats()));
  localStorage.setItem('xf_cur', curId || '');
  localStorage.setItem('xf_mode', mode);
}

function getCfg(){
  var vendor = normalizeVendorName(localStorage.getItem('cf_vendor') || inferVendorFromConfig({
    url: localStorage.getItem('cf_url') || '',
    model: localStorage.getItem('cf_model') || ''
  }));
  var storedModel = localStorage.getItem('cf_model') || 'deepseek-v4-flash';
  var model = vendor === 'deepseek' ? normalizeModelName(storedModel) : storedModel;
  var info = API_VENDORS[vendor];
  var url = localStorage.getItem('cf_url') || ((info.urls && info.urls[0]) || 'https://api.deepseek.com');
  if(vendor === 'deepseek' && localStorage.getItem('cf_model') !== model){
    localStorage.setItem('cf_model', model);
  }
  localStorage.setItem('cf_vendor', vendor);
  return {
    vendor: vendor,
    url: url,
    key: localStorage.getItem('cf_key') || '',
    model: model,
    tavily: localStorage.getItem('cf_tav') || ''
  };
}

function chatsForMode(chatMode){
  return Object.keys(chats).filter(function(id){ return chats[id] && chats[id].mode === chatMode; });
}

function createChat(chatMode, doRender){
  var id = String(Date.now() + Math.floor(Math.random() * 1000));
  chats[id] = {
    name: '新对话',
    mode: chatMode,
    msgs: [],
    planEnabled: defaultPlanEnabled(chatMode),
    planState: initPlanState(chatMode)
  };
  curId = id;
  if(doRender !== false){
    save();
    render();
  }
  return id;
}

function ensureChatForMode(chatMode){
  if(curId && chats[curId] && chats[curId].mode === chatMode) return;
  var ids = chatsForMode(chatMode);
  curId = ids.length ? ids[ids.length - 1] : createChat(chatMode, false);
}

function currentChat(){

}

function whoName(chat, role){

}

function buildVolunteerRows(evidence){
  if(!evidence || !evidence.db_recommendations) return [];
  var rows = [];
  [['chong','冲'], ['wen','稳'], ['bao','保']].forEach(function(pair){
    var key = pair[0];
    var level = pair[1];
    (evidence.db_recommendations[key] || []).forEach(function(row){
      rows.push({
        level: level,
        school: row.school || '',
        major: row.major || '',
        year: row.year || '',
        score: row.score || '',
        rank: row.rank || '',
        source: row.source || ''
      });
    });
  });
  return rows;
}

function volunteerTableHtml(evidence){
  var rows = buildVolunteerRows(evidence);
  if(!rows.length) return '';
  function levelClass(level){
    if(level === '冲') return 'chong';
    if(level === '稳') return 'wen';
    return 'bao';
  }
  var html = '<div class="volunteer-table">';
  html += '<div class="volunteer-table-head">志愿推荐表</div>';
  html += '<div class="volunteer-table-wrap"><table>';
  html += '<thead><tr><th>档位</th><th>学校</th><th>专业</th><th>年份</th><th>最低分</th><th>位次</th><th>来源</th></tr></thead><tbody>';
  rows.forEach(function(row){
    html += '<tr>';
    html += '<td><span class="volunteer-level '+levelClass(row.level || '')+'">'+escapeHtml(row.level || '')+'</span></td>';
    html += '<td><div class="volunteer-school">'+escapeHtml(row.school || '')+'</div></td>';
    html += '<td><div class="volunteer-major">'+escapeHtml(row.major || '')+'</div></td>';
    html += '<td class="volunteer-meta">'+escapeHtml(String(row.year || ''))+'</td>';
    html += '<td class="volunteer-meta">'+escapeHtml(String(row.score || ''))+'</td>';
    html += '<td class="volunteer-meta">'+escapeHtml(String(row.rank || ''))+'</td>';
    html += '<td class="volunteer-meta">'+escapeHtml(row.source || '')+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}

function evidenceHtml(evidence){
  if(!evidence) return '';
  var html = '<details class="evidence"><summary>查看依据</summary>';
  var summaryLines = Array.isArray(evidence.evidence_summary) ? evidence.evidence_summary.filter(function(line){ return line && String(line).trim(); }) : [];
  if(summaryLines.length){
    html += '<div class="evidence-block"><div class="evidence-title">整理说明</div>';
    summaryLines.forEach(function(line){
      html += '<div class="evidence-line">'+escapeHtml(line)+'</div>';
    });
    html += '</div>';
  }
  var db = evidence.db_recommendations || {};
  ['chong','wen','bao'].forEach(function(key){
    var label = key === 'chong' ? '冲' : key === 'wen' ? '稳' : '保';
    var rows = db[key] || [];
    if(!rows.length) return;
    html += '<div class="evidence-block"><div class="evidence-title">'+label+'档参考</div>';
    rows.slice(0,3).forEach(function(row){
      var line = (row.school || '') + ' ' + (row.major || '') + ' ' + (row.year || '') + '年 最低' + (row.score || '?') + '分 位次' + (row.rank || '?');
      html += '<div class="evidence-line">'+escapeHtml(line.trim())+'</div>';
    });
    html += '</div>';
  });
  if(Array.isArray(evidence.web_findings) && evidence.web_findings.length){
    html += '<div class="evidence-block"><div class="evidence-title">联网补充</div>';
    evidence.web_findings.slice(0,5).forEach(function(item){
      var line = (item.title || '补充信息') + '：' + (item.summary || '');
      html += '<div class="evidence-line">'+escapeHtml(line)+'</div>';
    });
    html += '</div>';
  }
  if(Array.isArray(evidence.missing_fields) && evidence.missing_fields.length){
    var labels = evidence.missing_fields.map(function(field){
      return FIELD_LABELS[field] || field;
    });
    html += '<div class="evidence-block"><div class="evidence-title">还缺哪些信息</div>';
    html += '<div class="evidence-text">'+escapeHtml(labels.join('、'))+'</div></div>';
  }
  html += '</details>';
  return html;
}

function renderWelcome(chatMode){
  var icon = chatMode === 'fun' ? '🎭' : '🎓';
  var title = chatMode === 'fun' ? '娱乐模式' : '报考模式';
  var desc = chatMode === 'fun'
    ? '想轻松聊、吐槽、听大白话分析，都可以直接说。'
    : '把省份、分数或位次、选科、专业想法直接发过来，我会一步一步帮你排。';
  return '<div class="welcome"><div class="icon">'+icon+'</div><h2>'+title+'</h2><p>'+desc+'</p></div>';
}

function render(){
  ensureChatForMode(mode);
  var chat = chats[curId];
  var listHtml = '';
  chatsForMode(mode).forEach(function(id){
    var item = chats[id];
    var preview = item.msgs.length ? (item.msgs[item.msgs.length - 1].displayText || '').slice(0,18) : '还没开始聊天';
    listHtml += '<div class="item'+(id === curId ? ' on' : '')+'" data-id="'+id+'">';
    listHtml += '<div class="tit"><span class="name">'+escapeHtml(item.name || '新对话')+'</span>';
    if(item.planEnabled) listHtml += '<span class="tag">计划开</span>';
    listHtml += '<span class="del" data-del="'+id+'">×</span></div>';
    listHtml += '<div class="meta">'+escapeHtml(preview)+'</div></div>';
  });
  S('chatList').innerHTML = listHtml;

  S('btnG').className = mode === 'gaokao' ? 'on' : '';
  S('btnF').className = mode === 'fun' ? 'on' : '';
  S('avt').src = mode === 'fun' ? '/img_scifi.png' : '/img_suit.png';
  var planBtn = S('planBtn');
  planBtn.textContent = (chat && chat.planEnabled ? '计划模式：开' : '计划模式：关');
  planBtn.className = chat && chat.planEnabled ? 'plan-on' : '';
  var msgArea = S('msgArea');
  msgArea.className = 'msgs' + (mode === 'fun' ? ' fun-bg' : '');

  if(!chat || !chat.msgs.length){
    msgArea.innerHTML = renderWelcome(mode);
    return;
  }

  var html = '';
  chat.msgs.forEach(function(msg){
    var rowCls = msg.role === 'user' ? 'msg-row user' : 'msg-row assistant';
    var bubbleCls = msg.role === 'user' ? 'bubble user' : 'bubble assistant';
    html += '<div class="'+rowCls+'"><div class="'+bubbleCls+'">';
    html += '<div class="who">'+whoName(chat, msg.role)+'</div>';
    if(msg.role === 'assistant' && msg.status){
      html += '<div class="status">'+escapeHtml(msg.status);
      if(msg.pending && !msg.displayText) html += ' <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
      html += '</div>';
    }
    if(msg.displayText){
      html += '<div class="msg-text">'+escapeHtml(msg.displayText)+'</div>';
    }else if(msg.role === 'assistant' && msg.pending){
      html += '<div class="msg-empty">我正在整理...</div>';
    }
    if(msg.role === 'assistant' && msg.evidence && msg.kind !== 'question' && !looksLikeQuestionText(msg.displayText)){
      html += volunteerTableHtml(msg.evidence);
      html += evidenceHtml(msg.evidence);
    }
    html += '</div></div>';
  });
  msgArea.innerHTML = html;
  msgArea.scrollTop = msgArea.scrollHeight;
}

async function testConn(){
  var vendor = normalizeVendorName(S('sVendor').value);
  var url = S('sUrl').value.trim();
  var key = S('sKey').value.trim();
  var model = vendor === 'custom' ? S('sModelCustom').value.trim() : normalizeModelName(S('sModel').value.trim());

  var status = S('st');
  if(!url || !key || !model){
    status.innerHTML = '<span class="st b">请先填写 URL、Key 和模型名</span>';

  }
  status.textContent = '测试中...';
  try{
    var resp = await fetch(url.replace(/\/+$/,'') + '/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + key},
      body:JSON.stringify({model:model,messages:[{role:'user',content:'你好'}],max_tokens:5})
    });
    if(!resp.ok){
      var err = await resp.json().catch(function(){ return {}; });
      throw new Error((err.error && err.error.message) || ('HTTP ' + resp.status));
    }
    localStorage.setItem('cf_vendor', vendor);

    localStorage.setItem('cf_key', key);
    localStorage.setItem('cf_model', model);

    else localStorage.removeItem('cf_tav');
    status.innerHTML = '<span class="st g">连接正常，设置已保存。</span>';
    syncApiFields(vendor, {vendor:vendor, url:url, model:model});
    setTimeout(closeSet, 800);
  }catch(e){
    status.innerHTML = '<span class="st b">连接失败：'+escapeHtml(e.message)+'</span>';
  }
}

function historyForRequest(chat){
  return chat.msgs
    .filter(function(msg){ return !msg.pending; })
    .slice(-18)
    .map(function(msg){
      return {role:msg.role,displayText:msg.displayText || ''};
    });
}

function consumeSSEBuffer(buffer, onEvent){
  var parts = buffer.split('\n\n');
  buffer = parts.pop();
  parts.forEach(function(part){
    var lines = part.split('\n');
    var payloadText = lines
      .filter(function(line){ return line.indexOf('data:') === 0; })
      .map(function(line){ return line.slice(5).trim(); })
      .join('\n');
    if(!payloadText) return;
    try{
      onEvent(JSON.parse(payloadText));
    }catch(e){
      console.warn('sse parse failed', e);
    }
  });
  return buffer;
}

async function send(){
  if(isSending) return;
  var inp = S('inp');
  var text = inp.value.trim();
  if(!text) return;
  var chat = currentChat();
  chat.msgs.push({role:'user',displayText:text,rawText:'',evidence:null,planState:null,status:'',kind:'text'});
  if(chat.name === '新对话') chat.name = text.slice(0,16);
  inp.value = '';
  save();
  render();

  var assistant = {
    role:'assistant',
    displayText:'',
    rawText:'',
    evidence:null,
    planState:null,
    status:'正在整理你刚才提供的信息...',
    kind:'answer',
    pending:true
  };
  chat.msgs.push(assistant);
  render();

  isSending = true;
  S('sendBtn').disabled = true;

  try{
    var resp = await fetch('/chat/stream', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        mode: chat.mode,
        message: text,
        history: historyForRequest(chat).slice(0, -1),
        config: getCfg(),
        planner: {
          enabled: !!chat.planEnabled,
          planState: chat.planState || initPlanState(chat.mode)
        }
      })
    });
    if(!resp.ok || !resp.body){
      throw new Error('服务暂时没返回可读数据，请稍后再试。');
    }
    var reader = resp.body.getReader();
    var decoder = new TextDecoder('utf-8');
    var buffer = '';
    var shouldStop = false;

    function handleEvent(payload){
      if(payload.type === 'phase'){
        assistant.status = payload.text || '';
      }else if(payload.type === 'delta'){
        assistant.rawText += payload.text || '';
        assistant.displayText = stripMarkdownNoise(assistant.rawText);
      }else if(payload.type === 'evidence'){
        assistant.evidence = payload.evidence || null;
      }else if(payload.type === 'question'){
        assistant.kind = 'question';
        assistant.rawText = payload.text || '';
        assistant.displayText = stripMarkdownNoise(payload.text || '');
        assistant.status = '';
        assistant.pending = false;
        assistant.evidence = null;
        assistant.planState = payload.planState || null;
        chat.planState = payload.planState || chat.planState;
      }else if(payload.type === 'error'){
        assistant.kind = 'error';
        if(!assistant.rawText) assistant.rawText = payload.text || '';
        assistant.displayText = stripMarkdownNoise(assistant.rawText || payload.text || '出错了，请稍后再试。');
        assistant.status = '';
        assistant.pending = false;
        assistant.planState = payload.planState || null;
        chat.planState = payload.planState || chat.planState;
      }else if(payload.type === 'done'){
        assistant.pending = false;
        assistant.status = '';
        shouldStop = payload.kind !== 'answer';
        if(payload.planState){
          assistant.planState = payload.planState;
          chat.planState = payload.planState;
        }
        if(!assistant.displayText){
          assistant.displayText = assistant.kind === 'answer' ? '这次没有拿到有效回答，你可以再发一次。' : assistant.displayText;
        }
      }
      render();
    }

    while(true){
      var chunk = await reader.read();
      if(chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream:true});
      buffer = consumeSSEBuffer(buffer, handleEvent);
      if(shouldStop){
        try{ await reader.cancel(); }catch(e){}
        break;
      }
    }
    if(buffer.trim()){
      consumeSSEBuffer(buffer + '\n\n', handleEvent);
    }
  }catch(e){
    assistant.kind = 'error';
    assistant.pending = false;
    assistant.status = '';
    assistant.rawText = assistant.rawText || ('出错了：' + e.message);
    assistant.displayText = stripMarkdownNoise(assistant.rawText);
    render();
  }finally{
    isSending = false;
    S('sendBtn').disabled = false;
    save();
    render();
  }
}

    syncApiFields(nextVendor, {

      model: nextVendor === 'custom' ? S('sModelCustom').value.trim() : S('sModel').value.trim()
    });
  };

    localStorage.setItem('xf_tip_collapsed', collapsed ? '' : '1');

  S('setOverlay').onpointerup = function(){};
